{% extends "layout.html" %}

{% block content %}
<style>
    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }

    .dashboard-header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--text-main);
    }

    .dashboard-date {
        color: var(--text-muted);
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .stat-card {
        position: relative;
        overflow: hidden;
    }

    .stat-card .card-icon {
        position: absolute;
        top: 1rem;
        right: 1rem;
        width: 48px;
        height: 48px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.8;
    }

    .stat-card.primary .card-icon {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
        color: var(--primary);
    }

    .stat-card.accent .card-icon {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(52, 211, 153, 0.2) 100%);
        color: var(--accent);
    }

    .stat-card.warning .card-icon {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(251, 191, 36, 0.2) 100%);
        color: #F59E0B;
    }

    .stat-card .card-value {
        font-size: 2.25rem;
        margin-bottom: 0.25rem;
    }

    .stat-card .card-trend {
        font-size: 0.8rem;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 0.25rem;
        margin-top: 0.5rem;
    }

    .stat-card .card-trend.down {
        color: #EF4444;
    }

    .welcome-card {
        background: var(--primary-gradient);
        color: white;
        padding: 2rem;
        position: relative;
        overflow: hidden;
    }

    .welcome-card::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
    }

    .welcome-card h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        position: relative;
    }

    .welcome-card p {
        opacity: 0.9;
        position: relative;
    }

    .quick-actions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
    }

    .quick-action {
        background: rgba(255, 255, 255, 0.15);
        padding: 1rem;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        color: white;
    }

    .quick-action:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateX(5px);
    }

    .quick-action svg {
        width: 24px;
        height: 24px;
    }

    .section-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .section-title svg {
        width: 20px;
        height: 20px;
        color: var(--primary);
    }

    .dashboard-shortcuts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
    }

    .dashboard-shortcut {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        min-height: 88px;
        padding: 1.25rem;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-main);
        text-decoration: none;
        font-size: 1.05rem;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .dashboard-shortcut:hover {
        border-color: var(--primary);
        color: var(--primary);
        transform: translateY(-2px);
    }

    .dashboard-shortcut svg {
        width: 28px;
        height: 28px;
        color: var(--primary);
        flex-shrink: 0;
    }

    @media (max-width: 900px) {
        .dashboard-shortcuts {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 520px) {
        .dashboard-shortcuts {
            grid-template-columns: 1fr;
        }
    }

</style>

<div class="dashboard-header">
    <h1>总控制台</h1>
    <div class="dashboard-date">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span>{{ today_date if today_date else "今日" }}</span>
    </div>
</div>

<div class="dashboard-shortcuts" aria-label="快捷入口">
    <a href="/offer" class="dashboard-shortcut">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        </svg>
        <span>报价订单</span>
    </a>
    <a href="/cli" class="dashboard-shortcut">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span>客户表</span>
    </a>
    <a href="/mail" class="dashboard-shortcut">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        <span>邮件中心</span>
    </a>
    <a href="/email_task" class="dashboard-shortcut">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
        </svg>
        <span>开发信任务管理</span>
    </a>
</div>

{% endblock %}
